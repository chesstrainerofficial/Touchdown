 let h=`<h1>✈ Butter Landing</h1><div>Total points: <b>${save.pts}</b> · Pick an aircraft, then fly. Livery is random each flight. Land softly (under 150 fpm = BUTTER) in the touchdown zone.</div><button id="fly">Fly ${cur.name} (Enter)</button>${cur.liv=='P'?'':' <span class="hint">Livery:</span> '+['R',...cur.liv].map(c=>`<button class="${(cur.liv.includes(selLv)?selLv:'R')==c?'':'g'}" data-lv="${c}">${c=='R'?'Random':LV[c].n+(save.pts>=LVU[c]?'':' 🔒'+LVU[c])}</button>`).join('')}<div style="margin:8px 0">Mode: ${[['A','Quick approach'],['F','Full flight']].map(m=>`<button class="${mode==m[0]?'':'g'}" data-mode="${m[0]}">${m[1]}</button>`).join('')} &nbsp;Throttle: ${[[0,'Manual'],[1,'Auto']].map(m=>`<button class="${autoThr==m[0]?'':'g'}" data-auto="${m[0]}">${m[1]}</button>`).join('')}</div><div class="grid">`;
 P.forEach((p,i)=>{const u=save.pts>=p.unl,b=save.best[p.id];

 P.forEach((p,i)=>{const c=$('pv'+i).getContext('2d'),k2=Math.min(1.1,125/pl(p));c.translate(85-pl(p)*.1*k2,52);c.scale(k2,k2);drawPlane(c,p,p.liv=='P'?priv():LV[p.liv[0]],pl(p),0,0)});

const WORDS={500:'FIVE HUNDRED',400:'FOUR HUNDRED',300:'THREE HUNDRED',200:'TWO HUNDRED',100:'ONE HUNDRED',50:'FIFTY',40:'FORTY',30:'THIRTY',20:'TWENTY',10:'TEN'};
function say(t,col,spk=true){s.call={t,col:col||'#fff',ttl:1.3};
 if(spk&&!mute&&window.speechSynthesis)try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.toLowerCase());u.rate=1.2;speechSynthesis.speak(u)}catch(e){}}
function beep(f,d,v=.05){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

function step(dt){

 const a=s.a;
 if(s.ph=='roll'||s.ph=='crash'){s.rt=(s.rt||0)+dt;
  if(s.ph=='roll'){s.V=Math.max(0,s.V-18*dt);s.gx+=s.V*1.688*dt;s.pitch=Math.max(0,s.pitch-4*dt)}

 const pr={Light:1,Small:.9,Medium:.75,Large:.6}[a.cls];
 const sh=k.ShiftLeft||k.ShiftRight;s.pitch+=(k.Space?10*pr:sh?-10*pr:-1.2*pr)*dt;if(s.leg=='cruise')s.pitch+=(3-s.pitch)*Math.min(1,dt*2);
 if(s.leg=='cruise')s.thrC=.5;else if(autoThr)s.thrC=s.land?(s.alt<12?0:cl(.5+(a.vref-s.V)/a.vref*3,0,1)):(s.leg=='toff'?1:.9);else s.thrC=cl(s.thrC+((k.ArrowUp?.45:0)-(k.ArrowDown?.45:0))*dt,0,1);
 s.thr+=(s.thrC-s.thr)*Math.min(1,dt*a.lag*4);
 if(s.og){s.V+=(s.thr*(a.cls=='Light'?9:6.5)-s.V*.012)*dt;s.pitch=cl(s.pitch,0,11);s.vs=0;s.alt=0;s.gx+=s.V*1.688*dt;if(s.V>=a.vref*.9&&s.pitch>=5){s.og=false;s.leg='climb';s.vs=2;say('ROTATE','#fff')}return}
 const Vt=a.vref*(.72+.56*s.thr)-(s.pitch-3)*a.vref*.012;
 s.V=Math.max(20,s.V+(Vt-s.V)*dt*a.lag*1.8);
 const vst=a.vref*.65,stalled=s.V<vst;s.warnStall=s.V<vst*1.1||s.pitch>14;
 if(stalled)s.pitch-=4*dt;

 let lift=Math.pow(s.V/a.vref,2)*(1+.07*(s.pitch-3));
 if(stalled)lift*=.55;lift*=1+.2*Math.max(0,1-s.alt/35);

 if(s.leg=='cruise')s.vs=(900-s.alt)*1.2;if(s.land&&s.alt<35)s.vs+=(-1.5-s.vs)*Math.min(1,dt*1.2);s.alt+=s.vs*dt;s.gx+=s.V*1.688*dt;
 if(s.leg=='climb'&&s.alt>=900){s.leg='cruise';s.ct=0;say('LEVEL OFF','#fff')}
 else if(s.leg=='cruise'){s.ct+=dt;if(s.ct>4){s.leg='descent';s.land=true;s.gx=-(50*a.vref*1.688+700);say('AIRPORT AHEAD','#fff')}}
 else if(s.leg=='descent'&&s.alt<=400)s.leg='approach';
 const fpm=-s.vs*60;
 if(s.land)for(const hh of [500,400,300,200,100,50,40,30,20,10])if(s.alt<=hh&&!s.called[hh]){s.called[hh]=1;say(WORDS[hh])}
 if(a.mk=='A'&&s.land&&s.alt<=20&&s.thrC>.05){s.ret-=dt;if(s.ret<=0){s.ret=1;say('RETARD','#ffb020')}}
 if(s.warnStall){s.sk-=dt;if(s.sk<=0){s.sk=.18;beep(95,.1,.08)}}

 if(s.alt>(s.mode=='F'?2200:1200))return fail('Go-around','You climbed away from the approach.');

function fail(title,reason){s.ph='crash';s.rt=0;s.res={crash:true,title,reason}}
function touch(fpm){
 s.alt=0;const a=s.a;
 if(s.gx<0)return fail('CRASH','Landed short of the runway.');
 if(s.gx>s.rw)return fail('CRASH','Ran off the end of the runway.');
 if(s.pitch<-6)return fail('CRASH','Nose gear collapsed.');
 if(fpm>800)return fail('CRASH','Hard landing: structural failure ('+Math.round(fpm)+' fpm).');
 if(fpm>450&&s.bounce<2){s.bounce++;s.worst=Math.max(s.worst,fpm);s.vs=fpm/60*.3;s.alt=.5;say('BOUNCE','#ffb020',false);return}
 const f=Math.max(fpm,s.worst),n=[];let g,b;
 if(f<=150){g='BUTTER';b=1000}else if(f<=250){g='SMOOTH';b=600}else if(f<=400){g='FIRM';b=300}else{g='HARD';b=100}
 if(s.pitch>(a.cls=='Light'?13:11)){b*=.5;n.push('Tail strike ×0.5')}
 if(s.pitch<0){b*=.6;n.push('Nose gear first ×0.6')}

function showRes(){
 const r=s.res,o=$('ov'),a=s.a;o.hidden=false;
 let un=[],lu=[];
 if(!r.crash){const old=save.pts;save.pts+=r.pts;un=P.filter(p=>p.unl>old&&p.unl<=save.pts);lu=Object.keys(LVU).filter(c=>LVU[c]>old&&LVU[c]<=save.pts);
  if(!save.best[a.id]||r.fpm<save.best[a.id])save.best[a.id]=r.fpm;store()}
 o.innerHTML=r.crash?`<h1>${s.lv.n} ${a.name}</h1><div class="big" style="color:#ff6b5a">${r.title}</div><div>${r.reason}</div><div class="hint">No points this time.</div>`
 :`<h1>${s.lv.n} ${a.name}</h1><div class="big" style="color:${r.g=='BUTTER'?'#ffd34d':'#fff'}">${r.g=='BUTTER'?'🧈 ':''}${r.g}!</div>

 <div>${r.n.join(' · ')}</div><div class="big" style="font-size:28px">+${r.pts} pts <span class="hint">(total ${save.pts})</span></div>`
 +un.map(p=>`<div style="color:#7dff9b">🔓 Unlocked: ${p.name}</div>`).join('')+lu.map(c=>`<div style="color:#7dff9b">🎨 Livery unlocked: ${LV[c].n}</div>`).join('')+`<button id="nx">Next flight (Enter)</button><button class="g" id="lb">Library (Esc)</button>`;
 $('nx').onclick=start;$('lb').onclick=lib;s.ph='done';
}

 x.fillStyle='#5d9a45';x.fillRect(0,GY,W,H-GY);x.fillStyle='#4f8a3b';x.fillRect(0,GY+60,W,H);
 const x0=sx(0),x1=sx(s.rw);x.fillStyle='#3b3f46';x.fillRect(x0,GY,x1-x0,12);x.fillStyle='rgba(80,230,120,.45)';x.fillRect(sx(200),GY-5,4300*S,17);x.fillStyle='#7dff9b';x.font='bold 13px system-ui';x.textAlign='center';x.fillText('LANDING ZONE',sx(2350),GY-12);
 x.fillStyle='#e8e8e8';for(let wx=200;wx<s.rw-200;wx+=150)x.fillRect(sx(wx),GY+5,14,2);

 for(let wx=Math.ceil((gx-PX/S)/1000)*1000;wx<gx+(W-PX)/S;wx+=1000){if(wx<0||wx>s.rw)continue;x.fillStyle='#fff';x.fillRect(sx(wx),GY+12,2,8);x.fillText(wx/1000+'k',sx(wx),GY+34)}
 for(let i=0;i<12;i++){const wx=-2400+i*200,on=Math.floor(s.t*12)%12==i;x.fillStyle='#fff';x.fillRect(sx(wx),GY-8,2,8);x.fillStyle=on?'#fff':'#e0a53a';x.beginPath();x.arc(sx(wx)+1,GY-9,on?4:2.5,0,7);x.fill()}

 if(s.ph=='crash'){const q=s.rt||0;for(let i=0;i<9;i++){x.fillStyle=i%2?'#ff9a1f':'#ff3b1f';x.beginPath();x.arc(PX+Math.sin(i*2)*q*50,GY-q*30-i*3,10+q*22,0,7);x.fill()}}
 // HUD
 x.restore();const u=cv.clientWidth<640?1.4:1;x.save();x.scale(u,u);x.textAlign='left';x.fillStyle='rgba(8,16,26,.62)';x.fillRect(10,10,200,132);
 const fpm=Math.round(-s.vs*60),warn=s.warnStall;
 x.font='600 13px ui-monospace,monospace';x.fillStyle='#cfe3f5';
 x.fillText('RA',20,32);x.fillText('V/S',20,62);x.fillText('IAS',20,86);x.fillText('PITCH',20,110);x.fillText('DIST',20,132);

function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
